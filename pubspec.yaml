name: buritto
description: "A minimalist, offline-first period and cycle tracker with local encrypted storage and on-device cycle prediction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.3.0
  local_auth: ^3.0.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  statistics: ^1.2.1
  collection: ^1.19.1
  worker_manager: ^7.2.9
  synchronized: ^3.4.1
  chrono_dart: ^2.0.2
  tflite_flutter: ^0.12.1
  dart_wordpiece: ^1.2.0
  messagepack: ^0.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
   - assets/population/
   - assets/models/
  fonts:
   - family: Shifa-Rame
     fonts:
       - asset: fonts/shifa-rame.ttf
         weight: 500
   - family: Cake-Cafe
     fonts:
       - asset: fonts/cake-cafe.ttf
         weight: 500
   - family: Hey-Comic
     fonts:
       - asset: fonts/hey-comic.ttf
         weight: 500
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
